name: Update Changelog

on:
  release:
    types: [released]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Update changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1
        with:
          latest-version: ${{ github.event.release.name }}
          release-notes: ${{ github.event.release.body }}

      - name: Create changelog PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-changelog
          base: master
          commit-message: Update CHANGELOG
          title: "Update CHANGELOG for ${{ github.event.release.name }}"
          body: |
            This PR updates CHANGELOG.md for release `${{ github.event.release.name }}`.

            Automatically generated by the Update Changelog workflow.
          add-paths: |
            CHANGELOG.md
